name: "Repro: patch application fails on valid pnpm patch"
on: [push, workflow_dispatch]

jobs:
  aube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install aube
        run: npm install -g @endevco/aube@1.4.0

      - name: aube install
        working-directory: patch-application-failure
        run: aube install

  pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: pnpm install
        working-directory: patch-application-failure
        run: pnpm install
